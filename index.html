/* Layout: single phone-width tool. Units, range, trip, up/down switch, then one big answer panel. */
:root{
  --bg:#E6E9E5;
  --card:#FBFCFA;
  --ink:#141916;
  --muted:#59635D;
  --rule:#D0D6D1;
  --soft:#EEF1ED;
  --up:#1E7543;
  --down:#B0341E;
  --warn-bg:#FBF0D9;
  --warn-ink:#6B4A06;
  --on-color:#FFFFFF;
  --meter:#F2C14E;--meter-edge:#B98A16;--meter-ink:#1B1A12;
  --lcd-bg:#C7D1BF;--lcd-ink:#121A14;
  --lead-red:#D23A2F;--lead-blk:#1E2420;
  --f-display:"Barlow Condensed","Roboto Condensed","sans-serif-condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1210;--card:#161B18;--ink:#E8EDE9;--muted:#9AA59E;--rule:#2B332E;--soft:#1D2420;
    --up:#55C584;--down:#F27D62;--warn-bg:#2E2512;--warn-ink:#F2CF85;--on-color:#0E1210;
    --meter:#D7A93A;--meter-edge:#8E6C1E;--lcd-bg:#B9C4B1;--lead-red:#F0675B;--lead-blk:#CDD5CF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1210;--card:#161B18;--ink:#E8EDE9;--muted:#9AA59E;--rule:#2B332E;--soft:#1D2420;
  --up:#55C584;--down:#F27D62;--warn-bg:#2E2512;--warn-ink:#F2CF85;--on-color:#0E1210;
  --meter:#D7A93A;--meter-edge:#8E6C1E;--lcd-bg:#B9C4B1;--lead-red:#F0675B;--lead-blk:#CDD5CF;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);color:var(--ink);
  font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px 8px;
}
.card{
  max-width:440px;margin:0 auto;
  background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:12px;
  display:flex;flex-direction:column;gap:10px;
}
h1{
  margin:0;font-family:var(--f-display);font-weight:700;
  font-size:24px;line-height:1;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;
}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sub{margin:5px 0 0;color:var(--muted);font-size:13px}
.lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font:600 14px/1 var(--f-body);padding:9px 12px;border-radius:999px;
  border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}

.lblrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini{display:flex;gap:4px}
.mchip{
  font:600 12px/1 var(--f-body);padding:6px 9px;border-radius:999px;
  border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer;
}
.mchip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.mchip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.inwrap{
  display:flex;align-items:center;min-width:0;
  border:1px solid var(--rule);border-radius:6px;background:var(--soft);
}
.inwrap input{
  flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);
  font:600 18px/1.2 var(--f-num);padding:8px 10px;font-variant-numeric:tabular-nums;
}
.inwrap .u{padding-right:10px;color:var(--muted);font-size:13px;white-space:nowrap}
.pm{
  border:0;border-right:1px solid var(--rule);background:transparent;color:var(--muted);
  font:600 16px/1 var(--f-num);padding:10px 10px;cursor:pointer;
}

/* Up / down switch */
.dir{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dbtn{
  font-family:var(--f-display);font-weight:700;font-size:clamp(17px,5.4vw,22px);letter-spacing:.06em;text-transform:uppercase;
  white-space:nowrap;padding:10px 8px;border-radius:6px;cursor:pointer;
  background:var(--card);color:var(--muted);border:2px solid var(--rule);
}
.dbtn.up[aria-pressed="true"]{background:var(--up);border-color:var(--up);color:var(--on-color)}
.dbtn.down[aria-pressed="true"]{background:var(--down);border-color:var(--down);color:var(--on-color)}

.chip:focus-visible,.pm:focus-visible,.dbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.inwrap input:focus-visible{outline:none}
.inwrap:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}

/* Answer */
.result{
  background:var(--soft);border:1px solid var(--rule);border-radius:8px;
  padding:12px;display:flex;flex-direction:column;gap:8px;
}
.big{font-family:var(--f-num);font-weight:600;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.huge{font-family:var(--f-num);font-weight:600;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.unit{font-size:16px;color:var(--muted);font-weight:500}
.small{font-size:13px;color:var(--muted)}
.result.up .huge{color:var(--up)}
.result.down .huge{color:var(--down)}
.vis{width:100%;height:auto;display:block}
.vis text{font-family:var(--f-num);font-size:11px;font-weight:500}
.eq{margin:0;font-size:14px}
.eq b{font-family:var(--f-num);font-weight:600}
.small b{font-family:var(--f-num);font-weight:600;color:var(--ink)}
.line{margin:0;font-size:14px}
.clip{border-top:1px solid var(--rule);padding-top:10px}
[hidden]{display:none !important}
.line b{font-family:var(--f-num);font-weight:600}
.warn{margin:0;font-size:13.5px;background:var(--warn-bg);color:var(--warn-ink);border-radius:6px;padding:8px 10px}

/* View tabs */
.tabs{display:grid;grid-template-columns:auto auto;gap:3px;padding:3px;background:var(--soft);border:1px solid var(--rule);border-radius:8px}
.tab{font:600 14px/1 var(--f-body);padding:9px 12px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--rule)}
.tab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.view{display:flex;flex-direction:column;gap:10px}

/* Loop view */
.loop{width:100%;height:auto;display:block}
.loop text{font-family:var(--f-body);font-size:11px;fill:var(--ink)}
.loop .t-name{font-size:12px;font-weight:600}
.loop .t-sm{font-size:10.5px;fill:var(--muted)}
.loop .t-val{font-family:var(--f-num);font-size:15px;font-weight:600}
.loop .t-lcd{font-family:var(--f-num);font-size:18px;font-weight:600;fill:var(--lcd-ink)}
.loop .t-lcds{font-size:9.5px;font-weight:600;fill:var(--lcd-ink)}
.loop .t-meter{font-family:var(--f-display);font-size:17px;font-weight:700;fill:var(--meter-ink)}
.loop .t-meter-sm{font-size:9.5px;font-weight:600;fill:var(--meter-ink)}
.flow{fill:none;stroke:var(--card);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:0.1 9;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-9.1}}
@media (prefers-reduced-motion: reduce){.flow{animation:none}}
.readout{background:var(--soft);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font:700 11.5px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:999px;border:1.5px solid currentColor}
.badge.adds{color:var(--up)}
.badge.drains{color:var(--down)}
.badge.off{color:var(--muted)}
.status{font:600 13px/1.2 var(--f-body);padding:6px 9px;border-radius:6px}
.status.trip{background:var(--ink);color:var(--card)}
.status.go{color:var(--muted);padding-right:0}
.status.fault{background:var(--warn-bg);color:var(--warn-ink)}
.hint{margin:0;font-size:14px;line-height:1.35;border-left:3px solid var(--ink);padding:2px 0 2px 10px;min-height:2.7em}
.ctl{display:flex;flex-direction:column;gap:8px}
.ctlrow{display:grid;grid-template-columns:118px 1fr;gap:8px;align-items:center}
.switch{display:flex;align-items:center;gap:8px;font:600 14px/1.2 var(--f-body);color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:7px 8px;cursor:pointer;text-align:left;min-width:0}
.knob{flex:none;width:40px;height:24px;border-radius:999px;background:var(--rule);position:relative;transition:background .15s}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.switch[aria-pressed="true"] .knob{background:var(--ink)}
.switch[aria-pressed="true"] .knob::after{left:19px}
.segrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule);border-radius:8px;overflow:hidden;min-width:0}
.seg button{font:600 14px/1 var(--f-body);padding:10px 4px;border:0;background:var(--card);color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.rule{margin:-4px 0 0}
.bl{font-family:var(--f-body);font-size:19px;font-weight:600}
.sl{display:flex;flex-direction:column;gap:0}
.sl input[type=range]{width:100%;margin:0;height:30px;accent-color:var(--ink)}
.slv{font:600 14px/1 var(--f-num);color:var(--ink)}
.nudge{display:flex;gap:6px;flex-wrap:wrap}
.nudge button{font:600 14px/1 var(--f-num);padding:9px 0;width:50px;border:1px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer}
.nudge .ans{font-family:var(--f-body);width:auto;flex:1 1 auto;padding:9px 8px;background:var(--soft)}
.switch:focus-visible,.seg button:focus-visible,.nudge button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

@media (max-width:330px){ .grid2{grid-template-columns:1fr} }
</style>
</head>
<body>
<main class="card">
  <header class="top">
    <h1>789 Trip</h1>
    <div class="tabs" role="tablist" aria-label="View">
      <button type="button" role="tab" class="tab" id="t-calc" aria-selected="true">Calculator</button>
      <button type="button" role="tab" class="tab" id="t-loop" aria-selected="false">Loop view</button>
    </div>
  </header>

  <section class="view" id="v-calc">
  <div class="chips" role="group" aria-label="Units">
    <button type="button" class="chip" data-unit="%" aria-pressed="false">%</button>
    <button type="button" class="chip" data-unit="kPa" aria-pressed="true">kPa</button>
    <button type="button" class="chip" data-unit="psi" aria-pressed="false">psi</button>
    <button type="button" class="chip" data-unit="mm" aria-pressed="false">mm</button>
    <button type="button" class="chip" data-unit="mmH2O" aria-pressed="false">mmH2O</button>
  </div>

  <div class="grid2">
    <div class="field">
      <label class="lbl" for="lrv">Range low</label>
      <div class="inwrap">
        <button type="button" class="pm" data-flip="lrv" aria-label="Flip sign of range low">±</button>
        <input id="lrv" type="text" inputmode="decimal" autocomplete="off" value="0">
        <span class="u u-lbl">kPa</span>
      </div>
    </div>
    <div class="field">
      <label class="lbl" for="urv">Range high</label>
      <div class="inwrap">
        <input id="urv" type="text" inputmode="decimal" autocomplete="off" value="600">
        <span class="u u-lbl">kPa</span>
      </div>
    </div>
  </div>

  <div class="field">
    <label class="lbl" for="tgt">Trip value</label>
    <div class="inwrap">
      <button type="button" class="pm" data-flip="tgt" aria-label="Flip sign of trip value">±</button>
      <input id="tgt" type="text" inputmode="decimal" autocomplete="off" value="328">
      <span class="u u-lbl">kPa</span>
    </div>
  </div>

  <div class="dir" role="group" aria-label="Direction">
    <button type="button" class="dbtn up" id="d-up" aria-pressed="false">▲ Going up</button>
    <button type="button" class="dbtn down" id="d-down" aria-pressed="true">▼ Going down</button>
  </div>

  <div class="field">
    <div class="lblrow">
      <label class="lbl" for="start">Transmitter sitting at</label>
      <div class="mini" role="group" aria-label="Transmitter reading units">
        <button type="button" class="mchip" data-smode="ma" aria-pressed="true">mA</button>
        <button type="button" class="mchip" data-smode="eu" aria-pressed="false"><span class="u-lbl">kPa</span></button>
      </div>
    </div>
    <div class="inwrap">
      <input id="start" type="text" inputmode="decimal" autocomplete="off" value="20">
      <span class="u" id="start-u">mA</span>
    </div>
    <div class="small" id="start-conv" hidden></div>
  </div>

  <div class="result down" id="result" aria-live="polite">
    <div>
      <div class="lbl">Set the 789 to</div>
      <div class="huge" id="r-set">7.25 <span class="unit">mA</span></div>
    </div>
    <svg class="vis" id="vis" viewBox="0 0 360 72" aria-hidden="true"></svg>
    <p class="eq" id="r-eq"></p>
    <div class="small" id="r-trip"><span id="r-triplbl">Trip point <b id="r-ma">12.75</b> mA · </span><span id="r-pct">54.7% of range</span></div>
    <p class="line clip" id="r-clip">Clip on: PLC drops to <b>16.00</b> first.</p>
    <p class="warn" id="r-warn" hidden></p>
  </div>
  </section>

  <section class="view" id="v-loop" hidden>
    <svg class="loop" id="loop" viewBox="0 0 360 212" role="img" aria-label="Loop diagram: PLC input card, transmitter and the 789 clipped on"></svg>

    <div class="readout" aria-live="polite">
      <div class="lrow">
        <span class="badge off" id="l-badge">789 not clipped on</span>
        <span class="status" id="l-status"></span>
      </div>
      <p class="eq" id="l-eq"></p>
      <svg class="vis" id="l-line" viewBox="0 0 360 72" aria-hidden="true"></svg>
    </div>

    <p class="hint" id="l-hint"></p>

    <div class="ctl">
      <div class="ctlrow">
        <button type="button" class="switch" id="l-on" aria-pressed="true"><span class="knob" aria-hidden="true"></span><span id="l-on-txt">Clipped</span></button>
        <div class="seg" role="group" aria-label="Where the 789 is clipped">
          <button type="button" data-at="card" aria-pressed="true">Card</button>
          <button type="button" data-at="tx" aria-pressed="false">Transmitter</button>
        </div>
      </div>
      <div class="ctlrow">
        <span class="lbl">Leads</span>
        <div class="seg" role="group" aria-label="Lead direction">
          <button type="button" data-lead="0" aria-pressed="false">+ to +</button>
          <button type="button" data-lead="1" aria-pressed="true">Flipped</button>
        </div>
      </div>
      <div class="sl">
        <div class="lblrow"><label class="lbl" for="l-tx">Transmitter</label><span class="slv" id="l-tx-v">12.00 mA</span></div>
        <input type="range" id="l-tx" min="4" max="20" step="0.01" value="12">
      </div>
      <div class="sl">
        <div class="lblrow"><label class="lbl" for="l-m">789 set to</label><span class="slv" id="l-m-v">0.00 mA</span></div>
        <input type="range" id="l-m" min="0" max="24" step="0.01" value="0">
      </div>
      <div class="nudge">
        <button type="button" data-nudge="-1">−1</button>
        <button type="button" data-nudge="-0.1">−0.1</button>
        <button type="button" data-nudge="0.1">+0.1</button>
        <button type="button" data-nudge="1">+1</button>
        <button type="button" class="ans" id="l-ans">Set to answer</button>
      </div>
    </div>
  </section>
</main>

<script>
(function(){
  var UNITS = ['%','kPa','psi','mm','mmH2O'];
  var KEY = 'trip789';
  var st = {unit:'kPa', lrv:'0', urv:'600', tgt:'328', dir:'down', start:'20', smode:'ma', view:'calc'};
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && typeof saved === 'object') {
      Object.keys(st).forEach(function(k){ if (typeof saved[k] === 'string') st[k] = saved[k]; });
    }
  } catch (e) {}
  if (UNITS.indexOf(st.unit) < 0) st.unit = 'kPa';
  if (st.dir !== 'up' && st.dir !== 'down') st.dir = 'down';
  if (st.smode !== 'ma' && st.smode !== 'eu') st.smode = 'ma';
  if (st.view !== 'calc' && st.view !== 'loop') st.view = 'calc';

  var $ = function(id){ return document.getElementById(id); };
  var FIELDS = ['lrv','urv','tgt','start'];
  FIELDS.forEach(function(k){ $(k).value = st[k]; });

  function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function num(v){
    v = String(v == null ? '' : v).trim().replace(',', '.');
    if (v === '' || v === '-' || v === '.' || v === '-.') return NaN;
    var n = Number(v);
    return isFinite(n) ? n : NaN;
  }
  function f2(x){ return (Math.round(x * 100) / 100).toFixed(2); }
  function f1(x){ return (Math.round(x * 10) / 10).toFixed(1); }

  function applyUI(){
    document.querySelectorAll('[data-unit]').forEach(function(b){
      b.setAttribute('aria-pressed', String(b.getAttribute('data-unit') === st.unit));
    });
    document.querySelectorAll('.u-lbl').forEach(function(el){ el.textContent = st.unit; });
    $('d-up').setAttribute('aria-pressed', String(st.dir === 'up'));
    $('d-down').setAttribute('aria-pressed', String(st.dir === 'down'));
    document.querySelectorAll('[data-smode]').forEach(function(b){
      b.setAttribute('aria-pressed', String(b.getAttribute('data-smode') === st.smode));
    });
    $('start-u').textContent = st.smode === 'eu' ? st.unit : 'mA';
  }
  // The transmitter reading in mA, whichever way it was typed.
  function startMa(lrv, urv){
    var v = num(st.start);
    if (!isFinite(v)) return NaN;
    return st.smode === 'eu' ? 4 + 16 * (v - lrv) / (urv - lrv) : v;
  }
  function showConv(lrv, urv){
    var C = $('start-conv'), v = num(st.start);
    if (!isFinite(v) || !isFinite(lrv) || !isFinite(urv) || lrv === urv) { C.hidden = true; return; }
    C.textContent = st.smode === 'eu'
      ? '= ' + f2(startMa(lrv, urv)) + ' mA'
      : '= ' + f1(lrv + (v - 4) / 16 * (urv - lrv)) + (st.unit === '%' ? '%' : ' ' + st.unit);
    C.hidden = false;
  }

  // The 4-20 line: transmitter marker, trip marker, and the arrow the 789 makes between them.
  function drawVis(o){
    var V = $('vis');
    if (!o.vis) { V.hidden = true; return; }
    V.hidden = false;
    var X = function(ma){ return 20 + (Math.min(20.5, Math.max(3.5, ma)) - 4) / 16 * 320; };
    var col = o.down ? 'var(--down)' : 'var(--up)';
    var xt = X(o.tMa), xp = X(o.trip), d = xp >= xt ? 1 : -1;
    var L = function(x){ return Math.min(300, Math.max(60, x)); }; // keep labels inside the frame
    var s = '<line x1="20" y1="38" x2="340" y2="38" stroke="var(--rule)" stroke-width="2"/>';
    [4, 8, 12, 16, 20].forEach(function(m){
      s += '<line x1="' + X(m) + '" y1="34" x2="' + X(m) + '" y2="42" stroke="var(--rule)" stroke-width="2"/>'
         + '<text x="' + X(m) + '" y="69" text-anchor="middle" fill="var(--muted)">' + m + '</text>';
    });
    if (Math.abs(xp - xt) > 10) {
      s += '<line x1="' + xt + '" y1="38" x2="' + (xp - 9 * d) + '" y2="38" stroke="' + col + '" stroke-width="4" stroke-linecap="round"/>'
         + '<polygon points="' + xp + ',38 ' + (xp - 10 * d) + ',32 ' + (xp - 10 * d) + ',44" fill="' + col + '"/>';
    }
    s += '<text x="' + ((xt + xp) / 2) + '" y="57" text-anchor="middle" fill="' + col + '" font-weight="600">789 ' + (o.down ? '−' : '+') + f2(o.setN) + '</text>';
    s += '<circle cx="' + xt + '" cy="38" r="6" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>'
       + '<text x="' + L(xt) + '" y="11" text-anchor="middle" fill="var(--ink)">transmitter ' + f2(o.tMa) + '</text>';
    s += '<circle cx="' + xp + '" cy="38" r="6" fill="' + col + '"/>'
       + '<text x="' + L(xp) + '" y="25" text-anchor="middle" fill="' + col + '" font-weight="600">trip ' + f2(o.trip) + '</text>';
    V.innerHTML = s;
  }

  function show(o){
    var R = $('result');
    R.className = 'result ' + (o.cls || 'none');
    $('r-ma').textContent = o.ma;
    $('r-pct').textContent = o.pct;
    $('r-triplbl').hidden = (o.ma === '—');
    $('r-set').innerHTML = o.set;
    $('r-eq').innerHTML = o.eq || '';
    $('r-eq').hidden = !o.eq;
    drawVis(o);
    $('r-clip').innerHTML = o.clip || '';
    $('r-clip').hidden = !o.clip;
    var W = $('r-warn');
    if (o.warn && o.warn.length) { W.textContent = o.warn.join(' '); W.hidden = false; }
    else { W.hidden = true; }
  }

  function calc(){
    FIELDS.forEach(function(k){ st[k] = $(k).value; });
    save();
    var lrv = num(st.lrv), urv = num(st.urv), tgt = num(st.tgt);
    var down = st.dir === 'down';
    showConv(lrv, urv);
    var start = startMa(lrv, urv);
    if (!isFinite(lrv) || !isFinite(urv)) return show({ma:'—', pct:'Enter the range low and high.', set:'—'});
    if (lrv === urv) return show({ma:'—', pct:'Range low and high can’t be the same.', set:'—'});
    if (!isFinite(tgt)) return show({ma:'—', pct:'Enter the trip value.', set:'—'});

    var frac = (tgt - lrv) / (urv - lrv);
    var ma = 4 + 16 * frac;
    var out = {ma:f2(ma), pct:f1(frac * 100) + '% of range', warn:[]};
    if (ma < 4 - 1e-9 || ma > 20 + 1e-9) {
      out.warn.push('That trip is outside the range. The PLC will see under 4 or over 20 mA and may call it a fault.');
    }
    if (!isFinite(start)) { out.set = '—'; out.warn.push('Enter what the transmitter is sitting at.'); return show(out); }
    if (start < 3.8 || start > 20.5) out.warn.push('The transmitter mA looks off. Check it with Magna first.');

    var set = down ? start - ma : ma - start;
    if (Math.abs(set) < 0.005) {
      out.cls = 'none';
      out.set = 'Nothing to do';
      out.warn.push('The transmitter is already sitting at the trip.');
      return show(out);
    }
    if (set < 0) {
      out.cls = 'none';
      out.set = '—';
      out.warn.push(down
        ? 'The trip is above where the transmitter sits. Switch to Going up.'
        : 'The trip is below where the transmitter sits. Switch to Going down.');
      return show(out);
    }

    out.cls = down ? 'down' : 'up';
    out.set = f2(set) + ' <span class="unit">mA</span>';
    out.vis = true; out.down = down; out.tMa = start; out.trip = ma; out.setN = set;
    out.eq = 'Transmitter <b>' + f2(start) + '</b> ' + (down ? '−' : '+') + ' 789 <b>' + f2(set) + '</b> = <b>' + f2(ma) + '</b> at the card';
    // The PLC jumps by whatever the 789 is set to at the moment you clip on.
    if (set >= 4 - 1e-9) {
      out.clip = 'Clip on at 4.00 and the PLC ' + (down ? 'drops' : 'rises') + ' to <b>' + f2(down ? start - 4 : start + 4) + '</b> first. Clip on at 0 and nothing moves.';
    } else {
      out.clip = 'Clip on with the 789 at <b>0</b>, then turn it up to <b>' + f2(set) + '</b>. At 4.00 the PLC would jump to <b>' + f2(down ? start - 4 : start + 4) + '</b>, past the trip.';
    }
    show(out);
  }

  document.querySelectorAll('[data-unit]').forEach(function(b){
    b.addEventListener('click', function(){
      st.unit = b.getAttribute('data-unit');
      if (st.unit === '%') { $('lrv').value = '0'; $('urv').value = '100'; }
      applyUI(); calc();
    });
  });
  document.querySelectorAll('[data-flip]').forEach(function(b){
    b.addEventListener('click', function(){
      var el = $(b.getAttribute('data-flip'));
      var v = el.value.trim();
      el.value = v.charAt(0) === '-' ? v.slice(1) : '-' + v;
      calc();
    });
  });
  $('d-up').addEventListener('click', function(){ st.dir = 'up'; $('start').value = st.smode === 'eu' ? $('lrv').value : '4'; applyUI(); calc(); });
  $('d-down').addEventListener('click', function(){ st.dir = 'down'; $('start').value = st.smode === 'eu' ? $('urv').value : '20'; applyUI(); calc(); });
  document.querySelectorAll('[data-smode]').forEach(function(b){
    b.addEventListener('click', function(){
      var mode = b.getAttribute('data-smode');
      if (mode === st.smode) return;
      // Keep the same reading, just show it the other way.
      var lrv = num($('lrv').value), urv = num($('urv').value), v = num($('start').value);
      if (isFinite(v) && isFinite(lrv) && isFinite(urv) && lrv !== urv) {
        $('start').value = mode === 'eu'
          ? String(Math.round((lrv + (v - 4) / 16 * (urv - lrv)) * 100) / 100)
          : String(Math.round((4 + 16 * (v - lrv) / (urv - lrv)) * 100) / 100);
      }
      st.smode = mode; applyUI(); calc();
    });
  });
  FIELDS.forEach(function(k){ $(k).addEventListener('input', calc); });

  /* ---------------- Loop view ----------------
     The 789 on mA SOURCE, clipped across part of a live 2-wire loop.
     Clipped across the card input:  + to + adds,   flipped drains.
     Clipped across the transmitter: + to + drains, flipped adds.
     The card sees transmitter +/- 789. With the 789 at 0 or unclipped, it sees the transmitter. */
  var ls = {on:true, at:'card', flip:true, tx:12, m:0};
  // Where each lead can land.
  var CLIP = {cardPos:{x:164, y:96}, cardNeg:{x:160, y:150}, txPos:{x:222, y:40}, txNeg:{x:204, y:96}};
  var JACK = {red:{x:224, y:124}, blk:{x:198, y:124}};
  // Each lead's path from its jack to each clip point, routed clear of the labels and the other jack.
  var LEAD = {
    red:{cardPos:'M224 124 C224 98 176 118 164 96', cardNeg:'M224 124 C224 104 166 104 160 150',
         txPos:'M224 124 C224 98 222 80 222 40',    txNeg:'M224 124 C224 112 204 116 204 96'},
    blk:{cardPos:'M198 124 C198 92 178 112 164 96', cardNeg:'M198 124 C198 110 164 110 160 150',
         txPos:'M198 124 C210 108 222 96 222 40',   txNeg:'M198 124 C198 112 204 116 204 96'}
  };

  function buildLoop(){
    var W = 'stroke="var(--muted)" stroke-width="2" fill="none" stroke-linejoin="round"';
    var dot = function(x, y){ return '<circle cx="' + x + '" cy="' + y + '" r="3.5" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"/>'; };
    var s = '';
    // PLC input card, with its 24 V loop supply and input resistor
    s += '<rect x="8" y="10" width="130" height="186" rx="8" fill="var(--card)" stroke="var(--muted)" stroke-width="1.5"/>';
    s += '<text x="73" y="28" text-anchor="middle" class="t-name">PLC input card</text>';
    s += '<path d="M22 60 V40 H138" ' + W + '/>';
    s += '<path d="M138 96 H98 V108" ' + W + '/>';
    s += '<path d="M98 138 V150 H138" ' + W + '/>';
    s += '<path d="M98 150 V182 H22 V68" ' + W + '/>';
    s += '<line x1="12" y1="60" x2="32" y2="60" stroke="var(--ink)" stroke-width="2.5"/>';
    s += '<line x1="17" y1="68" x2="27" y2="68" stroke="var(--ink)" stroke-width="2.5"/>';
    s += '<text x="36" y="68" class="t-sm">24 V</text>';
    s += '<rect x="92" y="108" width="12" height="30" rx="2" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"/>';
    s += '<text x="132" y="54" text-anchor="end" class="t-sm">+24V</text>';
    s += '<text x="132" y="91" text-anchor="end" class="t-sm">IN+</text>';
    s += '<text x="132" y="145" text-anchor="end" class="t-sm">IN−</text>';
    s += '<rect x="26" y="84" width="58" height="60" rx="4" fill="var(--lcd-bg)"/>';
    s += '<text x="55" y="100" text-anchor="middle" class="t-lcds">CARD SEES</text>';
    s += '<text id="lp-card" x="55" y="124" text-anchor="middle" class="t-lcd">12.00</text>';
    s += '<text x="55" y="138" text-anchor="middle" class="t-lcds">mA</text>';
    // Transmitter
    s += '<rect x="232" y="10" width="120" height="94" rx="8" fill="var(--card)" stroke="var(--muted)" stroke-width="1.5"/>';
    s += '<text x="296" y="30" text-anchor="middle" class="t-name">Transmitter</text>';
    s += '<text id="lp-tx" x="296" y="60" text-anchor="middle" class="t-val">12.00 mA</text>';
    s += '<text id="lp-txeu" x="296" y="80" text-anchor="middle" class="t-sm"></text>';
    s += '<text x="240" y="44" class="t-sm">+</text><text x="240" y="100" class="t-sm">−</text>';
    // Field wires and the IN− field terminal
    s += '<path d="M138 40 H232" ' + W + '/>';
    s += '<path d="M232 96 H138" ' + W + '/>';
    s += '<path d="M138 150 H160" ' + W + '/>';
    s += dot(138, 40) + dot(138, 96) + dot(138, 150) + dot(160, 150) + dot(232, 40) + dot(232, 96);
    // Current flow dots (speed follows the current)
    s += '<path id="lf-f1" class="flow" d="M22 60 V40 H232"/>';
    s += '<path id="lf-f2" class="flow" d="M232 96 H98 V108"/>';
    s += '<path id="lf-res" class="flow" d="M98 108 V138 V150 V182 H22 V68"/>';
    // The 789
    s += '<rect x="176" y="124" width="130" height="82" rx="12" fill="var(--meter)" stroke="var(--meter-edge)" stroke-width="1.5"/>';
    s += '<text x="198" y="143" text-anchor="middle" class="t-meter-sm">COM</text>';
    s += '<text x="224" y="143" text-anchor="middle" class="t-meter-sm">+</text>';
    s += '<text x="296" y="143" text-anchor="end" class="t-meter-sm">mA OUT</text>';
    s += '<rect x="186" y="148" width="110" height="34" rx="4" fill="var(--lcd-bg)"/>';
    s += '<text x="192" y="157.5" class="t-lcds" style="font-size:8.5px">SOURCE</text>';
    s += '<text id="lp-m" x="290" y="178" text-anchor="end" class="t-lcd" style="font-size:17px">0.00 mA</text>';
    s += '<text x="186" y="199" class="t-meter">789</text>';
    // Leads (drawn last so they lie on top)
    s += '<path id="lp-blk" fill="none" stroke="var(--lead-blk)" stroke-width="3.5" stroke-linecap="round"/>';
    s += '<path id="lp-red" fill="none" stroke="var(--lead-red)" stroke-width="3.5" stroke-linecap="round"/>';
    s += '<path id="lf-blk" class="flow" style="stroke-width:2"/>';
    s += '<path id="lf-red" class="flow" style="stroke-width:2"/>';
    s += '<circle id="lp-blkclip" r="5" fill="var(--lead-blk)" stroke="var(--card)" stroke-width="1.5"/>';
    s += '<circle id="lp-redclip" r="5" fill="var(--lead-red)" stroke="var(--card)" stroke-width="1.5"/>';
    s += '<circle cx="' + JACK.blk.x + '" cy="' + JACK.blk.y + '" r="6" fill="var(--lead-blk)" stroke="var(--meter-edge)" stroke-width="1.5"/>';
    s += '<circle cx="' + JACK.red.x + '" cy="' + JACK.red.y + '" r="6" fill="var(--lead-red)" stroke="var(--meter-edge)" stroke-width="1.5"/>';
    $('loop').innerHTML = s;
  }

  function setFlow(el, I, reverse){
    if (!(I > 0.05)) { el.style.display = 'none'; return; }
    el.style.display = '';
    el.style.animationDuration = (3.6 / Math.max(I, 0.3)).toFixed(2) + 's';
    el.style.animationDirection = reverse ? 'reverse' : 'normal';
  }
  function calcInfo(){
    var lrv = num(st.lrv), urv = num(st.urv), tgt = num(st.tgt);
    var range = isFinite(lrv) && isFinite(urv) && lrv !== urv;
    var info = {range:range, ok:range && isFinite(tgt), lrv:lrv, urv:urv, down:st.dir === 'down', start:startMa(lrv, urv)};
    if (info.ok) info.trip = 4 + 16 * (tgt - lrv) / (urv - lrv);
    return info;
  }
  function eu(ma, info){ return f1(info.lrv + (ma - 4) / 16 * (info.urv - info.lrv)) + (st.unit === '%' ? '%' : ' ' + st.unit); }

  function drawLoopLine(info, card, adds){
    var X = function(ma){ return 20 + (Math.min(21, Math.max(3, ma)) - 4) / 16 * 320; };
    var L = function(x){ return Math.min(290, Math.max(70, x)); };
    var col = !ls.on ? 'var(--muted)' : (adds ? 'var(--up)' : 'var(--down)');
    var xt = X(ls.tx), xc = X(card), d = xc >= xt ? 1 : -1;
    var s = '<line x1="20" y1="38" x2="340" y2="38" stroke="var(--rule)" stroke-width="2"/>';
    [4, 8, 12, 16, 20].forEach(function(m){
      s += '<line x1="' + X(m) + '" y1="34" x2="' + X(m) + '" y2="42" stroke="var(--rule)" stroke-width="2"/>'
         + '<text x="' + X(m) + '" y="69" text-anchor="middle" fill="var(--muted)">' + m + '</text>';
    });
    if (info.ok) {
      var xp = X(info.trip);
      s += '<line x1="' + xp + '" y1="16" x2="' + xp + '" y2="48" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="3 3"/>'
         + '<text x="' + L(xp) + '" y="11" text-anchor="middle" fill="var(--ink)" font-weight="600">trip ' + f2(info.trip) + '</text>';
    }
    if (ls.on && Math.abs(xc - xt) > 10) {
      s += '<line x1="' + xt + '" y1="38" x2="' + (xc - 9 * d) + '" y2="38" stroke="' + col + '" stroke-width="4" stroke-linecap="round"/>'
         + '<polygon points="' + xc + ',38 ' + (xc - 10 * d) + ',32 ' + (xc - 10 * d) + ',44" fill="' + col + '"/>';
    }
    s += '<circle cx="' + xt + '" cy="38" r="6" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>';
    s += '<circle cx="' + xc + '" cy="38" r="5" fill="' + (ls.on ? col : 'var(--ink)') + '"/>';
    s += '<text x="' + L(xc) + '" y="57" text-anchor="middle" fill="' + (ls.on ? col : 'var(--ink)') + '" font-weight="600">card ' + f2(card) + (info.range ? ' = ' + eu(card, info) : '') + '</text>';
    $('l-line').innerHTML = s;
  }

  function renderLoop(){
    var info = calcInfo();
    var adds = ls.at === 'card' ? !ls.flip : ls.flip;
    var m = ls.on ? ls.m : 0;
    var raw = ls.tx + (adds ? m : -m);
    var card = Math.max(0, raw);

    // Controls
    $('l-on').setAttribute('aria-pressed', String(ls.on));
    $('l-on-txt').textContent = ls.on ? 'Clipped' : 'Clip on';
    document.querySelectorAll('[data-at]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-at') === ls.at)); });
    document.querySelectorAll('[data-lead]').forEach(function(b){ b.setAttribute('aria-pressed', String((b.getAttribute('data-lead') === '1') === ls.flip)); });
    $('l-tx-v').textContent = f2(ls.tx) + ' mA' + (info.range ? ' = ' + eu(ls.tx, info) : '');
    $('l-m-v').textContent = f2(ls.m) + ' mA';

    // Diagram
    $('lp-card').textContent = f2(card);
    $('lp-tx').textContent = f2(ls.tx) + ' mA';
    $('lp-txeu').textContent = info.range ? '= ' + eu(ls.tx, info) : '';
    $('lp-m').textContent = f2(ls.m) + ' mA';
    var red, blk, rc, bc;
    if (!ls.on) {
      // Not connected: both leads hang off the right side of the meter.
      red = 'M224 124 C224 114 262 114 292 116 S330 132 330 176'; rc = {x:330, y:176};
      blk = 'M198 124 C198 107 252 107 300 110 S346 131 346 190'; bc = {x:346, y:190};
    } else {
      var pos = ls.at === 'card' ? 'cardPos' : 'txPos', neg = ls.at === 'card' ? 'cardNeg' : 'txNeg';
      var rk = ls.flip ? neg : pos, bk = ls.flip ? pos : neg;
      rc = CLIP[rk]; bc = CLIP[bk];
      red = LEAD.red[rk]; blk = LEAD.blk[bk];
    }
    $('lp-redclip').setAttribute('cx', rc.x); $('lp-redclip').setAttribute('cy', rc.y);
    $('lp-blkclip').setAttribute('cx', bc.x); $('lp-blkclip').setAttribute('cy', bc.y);
    $('lp-red').setAttribute('d', red); $('lf-red').setAttribute('d', red);
    $('lp-blk').setAttribute('d', blk); $('lf-blk').setAttribute('d', blk);
    $('lp-red').style.opacity = $('lp-blk').style.opacity = ls.on ? '1' : '0.55';
    // Field wires carry the transmitter current when the 789 is on the card, the card current when it is on the transmitter.
    var field = ls.at === 'card' ? ls.tx : card;
    setFlow($('lf-f1'), field, false);
    setFlow($('lf-f2'), field, false);
    setFlow($('lf-res'), card, false);
    setFlow($('lf-red'), m, false);   // out of the 789's + jack
    setFlow($('lf-blk'), m, true);    // back into COM

    // Readout
    var B = $('l-badge');
    B.className = 'badge ' + (!ls.on ? 'off' : adds ? 'adds' : 'drains');
    B.textContent = !ls.on ? '789 not clipped on' : adds ? '789 adds' : '789 drains';
    $('l-eq').innerHTML = ls.on
      ? 'Transmitter <b>' + f2(ls.tx) + '</b> ' + (adds ? '+' : '−') + ' 789 <b>' + f2(ls.m) + '</b> = card <b>' + f2(card) + '</b>' + (raw < 0 ? ' (can’t go below 0)' : '')
      : 'Transmitter <b>' + f2(ls.tx) + '</b> = card <b>' + f2(card) + '</b> (789 not connected)';

    var fault = card < 3.8 ? 'low' : card > 20.5 ? 'high' : '';
    var tripped = info.ok && (info.down ? card <= info.trip + 0.005 : card >= info.trip - 0.005);
    var S = $('l-status');
    if (fault) { S.className = 'status fault'; S.textContent = fault === 'low' ? 'Under 4 mA' : 'Over 20 mA'; }
    else if (tripped) { S.className = 'status trip'; S.textContent = 'Tripped'; }
    else if (info.ok) { S.className = 'status go'; S.textContent = f2(Math.abs(card - info.trip)) + ' mA to the trip'; }
    else { S.className = 'status'; S.textContent = ''; }

    // What to do next (kept to two lines)
    var ans = info.ok ? (info.down ? ls.tx - info.trip : info.trip - ls.tx) : NaN;
    var matches = adds === !info.down;
    var hint;
    if (!info.ok) hint = 'Set the range and trip on the Calculator tab first.';
    else if (ans < -0.005) hint = info.down
      ? 'The transmitter is already below the trip. Slide it up.'
      : 'The transmitter is already above the trip. Slide it down.';
    else if (!ls.on) hint = (matches && ans < ls.m - 0.005)
      ? 'Turn the 789 to 0 before you clip on. At ' + f2(ls.m) + ' the card jumps past the trip.'
      : 'Not connected. Tap Clip on. The card jumps by the 789’s ' + f2(ls.m) + ' mA.';
    else if (!matches) hint = 'This ' + (adds ? 'adds' : 'drains') + ', but the trip is going ' + (info.down ? 'down' : 'up') + '. Flip the leads.';
    else if (fault) hint = 'Card is ' + (fault === 'low' ? 'under 4' : 'over 20') + ' mA. The PLC may call that a fault, not a trip.';
    else if (tripped) hint = Math.abs(ls.m - ans) < 0.05
      ? 'Tripped at 789 = ' + f2(ls.m) + ', the same number the calculator gives.'
      : 'Past the trip. It trips at 789 = ' + f2(ans) + '.';
    else if (ls.m < 0.005) hint = 'Card = transmitter while the 789 is at 0. Turn it up and the card ' + (adds ? 'rises' : 'drops') + ': ' + f2(ans) + ' mA to go.';
    else hint = 'Turn the 789 up and the card ' + (adds ? 'rises' : 'drops') + ': ' + f2(ans - ls.m) + ' mA to go.';
    $('l-hint').textContent = hint;

    var A = $('l-ans');
    if (info.ok && ans >= 0 && matches && ans <= 24) { A.hidden = false; A.textContent = 'Set to ' + f2(ans); A.dataset.v = f2(ans); }
    else A.hidden = true;

    drawLoopLine(info, card, adds);
  }

  function loopInit(){
    var info = calcInfo();
    // Opens clipped on at the card with the 789 at 0, leads set for the trip direction: just turn the 789 up.
    ls.on = true; ls.at = 'card'; ls.flip = info.down; ls.m = 0;
    ls.tx = isFinite(info.start) ? Math.round(Math.min(20, Math.max(4, info.start)) * 100) / 100 : 12;
    $('l-tx').value = ls.tx; $('l-m').value = ls.m;
    renderLoop();
  }
  function setM(v){ ls.m = Math.round(Math.min(24, Math.max(0, v)) * 100) / 100; $('l-m').value = ls.m; renderLoop(); }

  function showView(v){
    st.view = v; save();
    $('t-calc').setAttribute('aria-selected', String(v === 'calc'));
    $('t-loop').setAttribute('aria-selected', String(v === 'loop'));
    $('v-calc').hidden = v !== 'calc';
    $('v-loop').hidden = v !== 'loop';
    if (v === 'loop') loopInit();
  }
  $('t-calc').addEventListener('click', function(){ showView('calc'); });
  $('t-loop').addEventListener('click', function(){ showView('loop'); });
  $('l-on').addEventListener('click', function(){ ls.on = !ls.on; renderLoop(); });
  document.querySelectorAll('[data-at]').forEach(function(b){
    b.addEventListener('click', function(){ ls.at = b.getAttribute('data-at'); ls.on = true; renderLoop(); });
  });
  document.querySelectorAll('[data-lead]').forEach(function(b){
    b.addEventListener('click', function(){ ls.flip = b.getAttribute('data-lead') === '1'; ls.on = true; renderLoop(); });
  });
  $('l-tx').addEventListener('input', function(){ ls.tx = Number($('l-tx').value); renderLoop(); });
  $('l-m').addEventListener('input', function(){ ls.m = Number($('l-m').value); renderLoop(); });
  document.querySelectorAll('[data-nudge]').forEach(function(b){
    b.addEventListener('click', function(){ setM(ls.m + Number(b.getAttribute('data-nudge'))); });
  });
  $('l-ans').addEventListener('click', function(){ setM(Number($('l-ans').dataset.v)); });

  buildLoop();
  applyUI();
  calc();
  showView(st.view);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
